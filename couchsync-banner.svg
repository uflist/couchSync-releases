<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="couchSync — watch party sincronizada para o Stremio">
  <style>
    .sofa   { animation: bounce 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .shadow { animation: shadow 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .eye    { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .wave   { animation: wave 2.6s ease-in-out infinite; opacity: 0; }
    .wave2  { animation-delay: .3s; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      40%      { transform: translateY(-3px) scale(.97, 1.03); }
      55%      { transform: translateY(0) scale(1.04, .95); }
      70%      { transform: translateY(0) scale(1, 1); }
    }
    @keyframes shadow {
      0%, 100% { transform: scaleX(1);    opacity: .45; }
      40%      { transform: scaleX(.8);   opacity: .25; }
      55%      { transform: scaleX(1.05); opacity: .5; }
    }
    @keyframes blink {
      0%, 93%, 100% { transform: scaleY(1); }
      96%           { transform: scaleY(.1); }
    }
    @keyframes wave {
      0%, 30%  { opacity: 0; }
      50%      { opacity: 1; }
      80%,100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sofa, .shadow, .eye, .wave { animation: none; }
      .wave { opacity: 1; }
    }
    .t    { font-family: "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211a15"/>
      <stop offset="1" stop-color="#15110e"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.17" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#e9a85f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e9a85f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c96b4f"/>
      <stop offset="1" stop-color="#a9533b"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b85d43"/>
      <stop offset="1" stop-color="#8f4330"/>
    </linearGradient>
  </defs>

  <rect width="880" height="240" rx="22" fill="url(#fundo)"/>
  <rect width="880" height="240" rx="22" fill="url(#brilho)"/>
  <rect x="1" y="1" width="878" height="238" rx="21" fill="none" stroke="#2a221c" stroke-width="2"/>

  <!-- sofá (o mesmo do frontend/logo/couchsync-logo.svg), 64 → 160 px -->
  <g transform="translate(64 40) scale(2.5)">
    <ellipse class="shadow" cx="32" cy="57" rx="22" ry="2.5" fill="#000"/>
    <g class="sofa">
      <rect x="12" y="16" width="40" height="22" rx="8" fill="url(#back)"/>
      <rect x="15"   y="34" width="16.5" height="9" rx="3" fill="#c76a4e"/>
      <rect x="32.5" y="34" width="16.5" height="9" rx="3" fill="#c76a4e"/>
      <rect x="15"   y="34" width="16.5" height="2.2" rx="1.1" fill="#e08a6a" opacity=".6"/>
      <rect x="32.5" y="34" width="16.5" height="2.2" rx="1.1" fill="#e08a6a" opacity=".6"/>
      <rect x="5"  y="27" width="11" height="20" rx="5.5" fill="url(#arm)"/>
      <rect x="48" y="27" width="11" height="20" rx="5.5" fill="url(#arm)"/>
      <rect x="9" y="42" width="46" height="7" rx="3.5" fill="#7e3a2a"/>
      <rect x="13" y="48" width="4" height="5" rx="1.5" fill="#3b2a22"/>
      <rect x="47" y="48" width="4" height="5" rx="1.5" fill="#3b2a22"/>
      <ellipse class="eye" cx="26" cy="25" rx="2.2" ry="2.9" fill="#1d1612"/>
      <ellipse class="eye" cx="38" cy="25" rx="2.2" ry="2.9" fill="#1d1612"/>
      <circle cx="26.8" cy="23.9" r=".75" fill="#f6e7d4"/>
      <circle cx="38.8" cy="23.9" r=".75" fill="#f6e7d4"/>
      <path d="M28.2 30 Q32 33.2 35.8 30" fill="none" stroke="#1d1612" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="21" cy="29.5" r="1.8" fill="#f0b47c" opacity=".55"/>
      <circle cx="43" cy="29.5" r="1.8" fill="#f0b47c" opacity=".55"/>
    </g>
    <path class="wave"       d="M27 9 Q32 5 37 9"  fill="none" stroke="#f2bf86" stroke-width="2" stroke-linecap="round"/>
    <path class="wave wave2" d="M23 5 Q32 -1 41 5" fill="none" stroke="#f2bf86" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text class="t" x="262" y="128" font-size="78" font-weight="800" fill="#f2e6d8" letter-spacing="-1.5">couch<tspan fill="#e9a85f" font-style="italic">Sync</tspan></text>
  <text class="t" x="266" y="172" font-size="22" fill="#a8988a">Watch party sincronizada para o Stremio</text>
  <text class="t" x="266" y="202" font-size="13" fill="#75685d" letter-spacing="1.6">QUALIDADE TOTAL · SEM SCREENSHARE · CONTROLADA PELO HOST</text>
</svg>
